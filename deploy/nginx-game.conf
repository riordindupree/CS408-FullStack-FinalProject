# nginx sits in front of the Spring Boot app as a reverse proxy.
#
# The Java app listens on port 3000, but visitors expect port 80.
# nginx takes port 80, forwards requests to the app, and is also the place
# where HTTPS, caching, and rate limiting would later be added.
#
# setup-ec2.sh copies this to /etc/nginx/conf.d/99-steps-and-7-falls.conf.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # '_' matches any hostname. Once you have a domain name, put it here
    # instead, then run certbot to add HTTPS.
    server_name _;

    # Don't advertise the exact nginx version to the world.
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Pass along the original request metadata so the app sees the real client
        # information instead of nginx as the source.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
