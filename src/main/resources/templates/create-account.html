<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - 99 Steps &amp; 7 Falls</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="container-fluid flex-grow-1 bg-light py-3">
        <section class="row justify-content-center">
            <div class="col-11 col-md-9 col-lg-8 col-xl-7">
                <div class="alert alert-info border border-dark rounded-0 p-3 p-md-4 mb-0">
                    <h1 class="h5 mb-3">Create an account</h1>
                    <p th:if="${reservedAccountId != null}">
                        Your Account ID will be: <strong th:text="${reservedAccountId}"></strong>
                    </p>
                    <div class="alert alert-danger rounded-0" role="alert" th:if="${param.error}">
                        Passwords must be at least 8 characters and include an uppercase letter,
                        a lowercase letter, a number, and a special character.
                    </div>
                    <form method="post" th:action="@{/account/create}">
                        <label for="password" class="form-label">Password</label>
                        <input id="password" name="password" type="password"
                            class="form-control rounded-0 mb-2" minlength="8"
                            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
                            title="At least 8 characters, including uppercase and lowercase letters, a number, and a special character."
                            aria-describedby="passwordRequirements" required>
                        <small id="passwordRequirements" class="form-text d-block mb-3">
                            Use at least 8 characters, including uppercase and lowercase letters,
                            a number, and a special character.
                        </small>
                        <button type="submit" class="btn btn-link link-dark text-decoration-none">
                            [ Create Account ]
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>

</html>
