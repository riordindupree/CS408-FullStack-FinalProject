<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 99 Steps &amp; 7 Falls</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="container-fluid flex-grow-1 bg-light py-3">
        <h1 class="h4 mb-4">Login</h1>

        <section class="row justify-content-center">
            <div class="col-11 col-md-9 col-lg-8 col-xl-7">
                <p class="text-center" th:if="${loggedInPlayerId != null}">
                    Your Account ID will be: <strong th:text="${loggedInPlayerId}"></strong>
                </p>
                <p class="text-center" th:if="${loggedInPlayerId == null}">
                    Your Account ID is assigned when you create an account and shown after registration.
                </p>
                <form class="alert alert-info border border-dark rounded-0 p-3 p-md-4 mb-0"
                    method="post" th:action="@{/login}">
                    <div class="alert alert-danger rounded-0" role="alert" th:if="${param.error}">
                        Player ID or password is incorrect.
                    </div>

                    <div class="row align-items-center mb-3">
                        <label for="playerId" class="col-sm-3 col-form-label">Player ID:</label>
                        <div class="col-sm-9">
                            <input id="playerId" name="playerId" type="number" min="1"
                                class="form-control rounded-0" required>
                        </div>
                    </div>

                    <div class="row align-items-center mb-4">
                        <label for="password" class="col-sm-3 col-form-label">Password:</label>
                        <div class="col-sm-9">
                            <input id="password" name="password" type="password"
                                class="form-control rounded-0" required>
                        </div>
                    </div>

                    <input th:if="${param.runComplete}" type="hidden" name="runComplete" value="true">
                    <div class="text-center">
                        <button type="submit" class="btn btn-link link-dark text-decoration-none">[ Login ]</button>
                    </div>
                    <p class="text-center mb-0" th:if="${param.runComplete}">
                        <a th:href="@{/run/complete}">Return to the completed run</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>

</html>
