<!DOCTYPE html>
<html lang="en">

<!-- start.html : defines a default file layout for the game page. Meant to be replaced or written over once game is actually implemented. -->

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99 Steps & 7 Falls</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="container-fluid flex-grow-1 bg-light py-3">
        <div class="row align-items-end g-2 mb-2">
            <div class="col">
                <h2 class="h5 mb-0">Steps: <span th:text="${steps}"></span></h2>
            </div>
            <div class="col-auto">
                <div class="btn-group" role="group" aria-label="Items">
                    <table class="table table-bordered border-dark table-info text-center align-middle mb-0" aria-label="Items">
                        <tbody>
                            <tr>
                                <td class="rounded-0">
                                    Item 1
                                    <button class="btn btn-sm btn-outline-dark rounded-0" type="button">toss</button>
                                </td>
                                <td class="rounded-0">
                                    Item 2
                                    <button class="btn btn-sm btn-outline-dark rounded-0" type="button">toss</button>
                                </td>
                                <td class="rounded-0">
                                    Item 3
                                    <button class="btn btn-sm btn-outline-dark rounded-0" type="button">toss</button>
                                </td>
                                <td class="rounded-0">
                                    Item 4
                                    <button class="btn btn-sm btn-outline-dark rounded-0" type="button">toss</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered border-dark table-info text-center align-middle mb-0 w-100"
                aria-label="Game board">
                <colgroup>
                    <col width="33.3333%">
                    <col width="33.3333%">
                    <col width="33.3333%">
                </colgroup>

                <tbody>
                    <tr>
                        <td class="py-5"></td>
                        <td class="py-5" th:text="${top}"></td>
                        <td class="py-5"></td>
                    </tr>
                    <tr>
                        <td class="py-5" th:text="${left}"></td>
                        <td class="py-5 fs-3">ก</td>
                        <td class="py-5" th:text="${right}"></td>
                    </tr>
                    <tr>
                        <td class="py-5"></td>
                        <td class="py-5" th:text="${bottom}"></td>
                        <td class="py-5"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-2" role="group" aria-label="Options">
            <div class="row g-0 justify-content-center">
                <div class="col-4">
                    <form action="/start/room-selection" method="post">
                        <input type="hidden" name="option" value="0">
                        <button class="btn btn-outline-dark rounded-0 w-100" type="submit" th:text="${option_1}"></button>
                    </form>
                </div>
            </div>
            <div class="row g-0 justify-content-center">
                <div class="col-4">
                    <form action="/start/room-selection" method="post">
                        <input type="hidden" name="option" value="1">
                        <button class="btn btn-outline-dark rounded-0 w-100" type="submit" th:text="${option_2}"></button>
                    </form>
                </div>
                <div class="col-4"></div>
                <div class="col-4">
                    <form action="/start/room-selection" method="post">
                        <input type="hidden" name="option" value="2">
                        <button class="btn btn-outline-dark rounded-0 w-100" type="submit" th:text="${option_3}"></button>
                    </form>
                </div>
            </div>
            <div class="row g-0 justify-content-center">
                <div class="col-4">
                    <form action="/start/room-selection" method="post">
                        <input type="hidden" name="option" value="3">
                        <button class="btn btn-outline-dark rounded-0 w-100" type="submit" th:text="${option_4}"></button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: siteFooter}"></div>

    <script th:if="${param.moved}">
        localStorage.setItem("game-moved", Date.now().toString());
        window.history.replaceState({}, document.title, "/start");
    </script>

</body>

</html>
