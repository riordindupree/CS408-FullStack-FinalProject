<!DOCTYPE html>
<html lang="en">

<!-- leaderboard.html : placeholder leaderboard layout. Meant to be replaced or written over once actual leaderboard data is implemented. -->

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99 Steps & 7 Falls</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="container-fluid flex-grow-1 bg-light py-3">
        <h1 class="h4 mb-3">Leaderboard</h1>

        <div class="row g-3 align-items-center mb-3">
            <div class="col-12 col-md-auto">
                <label for="playerSearch" class="form-label mb-0">Get Specific User:</label>
            </div>
            <div class="col-12 col-md-4">
                <input id="playerSearch" name="playerSearch" type="text" class="form-control form-control-sm rounded-0">
            </div>
        </div>

        <div class="d-flex flex-wrap gap-4 mb-4">
            <div class="form-check d-flex align-items-center gap-2">
                <label class="form-check-label" for="hasWon">Has Won</label>
                <input class="form-check-input m-0 rounded-0 border-dark" type="checkbox" id="hasWon" checked>
            </div>
            <div class="form-check d-flex align-items-center gap-2">
                <label class="form-check-label" for="highscoreOnly">Highscore Only</label>
                <input class="form-check-input m-0 rounded-0 border-dark" type="checkbox" id="highscoreOnly" checked>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered border-dark table-info text-center align-middle mb-0">
                <thead>
                    <tr>
                        <th scope="col">Player ID</th>
                        <th scope="col">Score</th>
                        <th scope="col">Steps Remaining</th>
                        <th scope="col"># of Runs</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>(...)</td>
                        <td>(...)</td>
                        <td>(...)</td>
                        <td>(...)</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: siteFooter}"></div>

</body>

</html>
