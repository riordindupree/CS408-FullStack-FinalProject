<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99 Steps & 7 Falls</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="container-fluid flex-grow-1 bg-light py-3">
        <h1 class="h4 mb-3">Leaderboard</h1>

        <form method="get" th:action="@{/leaderboard}" class="d-flex flex-wrap gap-4 align-items-center mb-4">
            <div class="row g-3 align-items-center mb-3 w-100">
                <div class="col-12 col-md-auto">
                    <label for="playerSearch" class="form-label mb-0">Get Specific User:</label>
                </div>
                <div class="col-12 col-md-4">
                    <input id="playerSearch" name="searchString" type="search"
                           th:value="${searchString}" inputmode="numeric"
                           class="form-control form-control-sm rounded-0">
                </div>
            </div>
            <div class="form-check d-flex align-items-center gap-2">
                <label class="form-check-label" for="hasWon">Has Won</label>
                <input type="hidden" name="hasWon" value="false">
                <input class="form-check-input m-0 rounded-0 border-dark" type="checkbox"
                       id="hasWon" name="hasWon" value="true" th:checked="${hasWon}">
            </div>
            <div class="form-check d-flex align-items-center gap-2">
                <label class="form-check-label" for="highscoreOnly">Highscore Only</label>
                <input type="hidden" name="highscoreOnly" value="false">
                <input class="form-check-input m-0 rounded-0 border-dark" type="checkbox"
                       id="highscoreOnly" name="highscoreOnly" value="true" th:checked="${highscoreOnly}">
            </div>
            <button type="submit" class="btn btn-sm btn-dark">Apply</button>
        </form>

        <div class="table-responsive">
            <table class="table table-bordered border-dark table-info text-center align-middle mb-0">
                <thead>
                    <tr>
                        <th scope="col">Player ID</th>
                        <th scope="col">Score</th>
                        <th scope="col">Steps Remaining</th>
                        <th scope="col"># of Runs</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entry : ${entries}">
                        <td th:text="${entry.playerId}"></td>
                        <td th:text="${entry.score}"></td>
                        <td th:text="${entry.stepsRemaining}"></td>
                        <td th:text="${entry.numberOfRuns}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(entries)}">
                        <td colspan="4">No leaderboard results yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <nav th:if="${totalPages > 1}" class="mt-3" aria-label="Leaderboard pages">
            <ul class="pagination justify-content-center mb-0">
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link" th:if="${currentPage > 1}"
                       th:href="@{/leaderboard(page=${currentPage - 1},hasWon=${hasWon},highscoreOnly=${highscoreOnly},searchString=${searchString})}"
                       aria-label="Previous page">Previous</a>
                    <span class="page-link" th:if="${currentPage == 1}" aria-hidden="true">Previous</span>
                </li>
                <li class="page-item disabled">
                    <span class="page-link" th:text="|Page ${currentPage} of ${totalPages}|"></span>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link" th:if="${currentPage < totalPages}"
                       th:href="@{/leaderboard(page=${currentPage + 1},hasWon=${hasWon},highscoreOnly=${highscoreOnly},searchString=${searchString})}"
                       aria-label="Next page">Next</a>
                    <span class="page-link" th:if="${currentPage == totalPages}" aria-hidden="true">Next</span>
                </li>
            </ul>
        </nav>
        <p class="text-center text-muted mt-2 mb-0"
           th:text="|Showing ${entries.size()} of ${totalResults} results|"></p>
    </main>

    <div th:replace="~{fragments/footer :: siteFooter}"></div>

</body>

</html>
