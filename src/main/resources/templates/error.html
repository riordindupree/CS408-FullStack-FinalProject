<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Canvas Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <div class="container py-5">
        <div class="alert alert-danger">
            <h4 class="alert-heading">Canvas Error</h4>
            <p th:if="${status != null}">
                HTTP <strong th:text="${status}"></strong>
                <span th:if="${error != null}" th:text="| - ${error}|"></span>
            </p>
            <p th:if="${path != null}" th:text="|Request: ${path}|"></p>
            <p th:if="${status == null}">Something went wrong. Check the application console for details.</p>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
