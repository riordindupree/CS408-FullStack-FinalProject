<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Canvas Error</title>

</head>
<body class="bg-light">

        <div class="alert alert-danger">
            <h4 class="alert-heading">Canvas Error</h4>

        </div>
    </div>
</body>
</html>
