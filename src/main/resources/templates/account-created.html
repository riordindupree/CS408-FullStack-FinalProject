<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Created - 99 Steps &amp; 7 Falls</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="container-fluid flex-grow-1 bg-light py-3">
        <section class="row justify-content-center">
            <div class="col-11 col-md-9 col-lg-8 col-xl-7">
                <div class="alert alert-success border border-dark rounded-0 p-3 p-md-4">
                    <h1 class="h4">Account created!</h1>
                    <p>Your Account ID will be: <strong th:text="${playerId}"></strong></p>
                    <p class="mb-0">Keep this ID and your password to log in later.</p>
                </div>
                <form method="post" th:action="@{/start/reset}">
                    <button class="btn btn-dark rounded-0" type="submit">Start a New Game</button>
                </form>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>

</html>
