<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Announcement Application</title>
</head>
<body class="bg-light">
    <h3 class="text text-center text-success">Canvas Announcement Feed</h5>
    <body class="text text-center text-success">
        Displays all announcements for a choosen course in chronological order.
    </body>

    <form method="get" th:action="@{/}">
            <div th:each="course : ${courses}" class="form-check">
                <input
                    class="form-check-input"
                    type="checkbox"
                    name="courseIds"
                    th:value="${course.id}"
                    th:id="${'course-' + course.id}"
                    th:checked="${courseIds != null and courseIds.contains(course.id)}">
                <label class="form-check-label" th:for="${'course-' + course.id}" th:text="${course.name}">
                    Course Name
                </label>
            </div>

            <button type="submit" class="btn btn-success mt-3">Load Announcements</button>
        </form>

    <h5 class="text-start border-top mt-4">Announcements:</h5>
    <table class = "table announcements_table">
        <thead>
        <tr>
            <th scope="col">Class</th>
            <th scope="col">Date</th>
            <th scope="col">Announcement</th>
        </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${announcementViews}">
                <td th:text="${item.courseName}">Course</td>
                <td th:text="${item.postedAt}">Date</td>
                <td th:utext="${item.message}">Description</td>
            </tr>

            <tr th:if="${#lists.isEmpty(announcementViews)}">
                <td colspan="3" class="text-center text-muted">No announcements selected.</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
