<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99 Steps & 7 Falls - Fight</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="container-fluid d-flex flex-column flex-grow-1 bg-light py-3">
        <!-- Keep the step count on the left and inventory at the top-right like the game screen. -->
        <div class="row align-items-end g-2 mb-2">
            <div class="col">
            <h2 class="h5 mb-0">Steps: <span th:text="${steps}"></span></h2>
            </div>
            <div class="col-auto">
                <table class="table table-bordered border-dark map-info text-center align-middle mb-0"
                    aria-label="Items">
                    <tbody>
                        <tr>
                            <td>
                                <span th:text="${item_1}"></span>
                                <form action="/start/toss_item" method="post">
                                    <input type="hidden" name="option" value="0">
                                    <button class="btn btn-sm btn-outline-dark dark-map" type="submit">toss</button>
                                </form>
                            </td>
                            <td>
                                <span th:text="${item_2}"></span>
                                <form action="/start/toss_item" method="post">
                                    <input type="hidden" name="option" value="1">
                                    <button class="btn btn-sm btn-outline-dark dark-map" type="submit">toss</button>
                                </form>
                            </td>
                            <td>
                                <span th:text="${item_3}"></span>
                                <form action="/start/toss_item" method="post">
                                    <input type="hidden" name="option" value="2">
                                    <button class="btn btn-sm btn-outline-dark dark-map" type="submit">toss</button>
                                </form>
                            </td>
                            <td>
                                <span th:text="${item_4}"></span>
                                <form action="/start/toss_item" method="post">
                                    <input type="hidden" name="option" value="3">
                                    <button class="btn btn-sm btn-outline-dark dark-map" type="submit">toss</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- The monster is above the player; blank side cells keep the usual game-board layout. -->
        <div class="table-responsive">
            <table class="table table-bordered border-dark map-info text-center align-middle mb-0 w-100"
                aria-label="Fight board">
                <colgroup>
                    <col width="33.3333%">
                    <col width="33.3333%">
                    <col width="33.3333%">
                </colgroup>
                <tbody>
                    <tr>
                        <td class="py-5"></td>
                        <td class="py-5 fs-3 multiline" th:text="${top}"></td>
                        <td class="py-5"></td>
                    </tr>
                    <tr>
                        <td class="py-5" th:text="${left}"></td>
                        <td class="py-5"></td>
                        <td class="py-5" th:text="${right}"></td>
                    </tr>
                    <tr>
                        <td class="py-5"></td>
                        <td class="py-5 fs-3" th:text="${bottom}"></td>
                        <td class="py-5"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Display the latest outcome returned by the combat interaction table. -->
        <div class="table-responsive">
            <table class="table table-bordered border-dark dark-map text-center align-middle mb-0 w-100"
                aria-label="Fight text">
                <tbody>
                    <tr>
                        <td class="py-4 multiline" th:text="${game_text}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- While combat continues, each directional button uses its matching inventory slot. -->
        <div th:unless="${victoryPending}" class="mt-2" role="group" aria-label="Combat options">
            <div class="row g-0 justify-content-center">
                <div class="col-4">
                    <form action="/fight/option" method="post">
                        <input type="hidden" name="option" value="0">
                        <button class="btn btn-outline-dark rounded-0 w-100" type="submit" th:text="${option_1}"></button>
                    </form>
                </div>
            </div>
            <div class="row g-0 justify-content-center">
                <div class="col-4">
                    <form action="/fight/option" method="post">
                        <input type="hidden" name="option" value="1">
                        <button class="btn btn-outline-dark rounded-0 w-100" type="submit" th:text="${option_2}"></button>
                    </form>
                </div>
                <div class="col-4"></div>
                <div class="col-4">
                    <form action="/fight/option" method="post">
                        <input type="hidden" name="option" value="2">
                        <button class="btn btn-outline-dark rounded-0 w-100" type="submit" th:text="${option_3}"></button>
                    </form>
                </div>
            </div>
            <div class="row g-0 justify-content-center">
                <div class="col-4">
                    <form action="/fight/option" method="post">
                        <input type="hidden" name="option" value="3">
                        <button class="btn btn-outline-dark rounded-0 w-100" type="submit" th:text="${option_4}"></button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Keep Run below the fight options on the left, with Collect shown after a victory. -->
        <div class="row g-0 mt-auto pt-2" role="group" aria-label="Fight choices">
            <div class="col-6">
                <form action="/fight/run" method="post" class="h-100">
                    <button class="btn btn-outline-danger rounded-0 w-100 h-100" type="submit">Run</button>
                </form>
            </div>
            <div th:if="${victoryPending}" class="col-6">
                <form action="/fight/collect" method="post" class="h-100">
                    <button class="btn btn-success rounded-0 w-100 h-100" type="submit" th:disabled="${!canCollect}">
                        Collect monster
                    </button>
                    <span th:if="${!canCollect}" class="d-block text-danger mt-2">
                        Your inventory is full. Toss an item before collecting the monster.
                    </span>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>

</html>
