<!DOCTYPE html>
<html lang="en">

<!-- delete.html : defines a default file layout for the map page. Meant to be replaced or written over once backend sql system is actually implemented. -->

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99 Steps & 7 Falls</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="container-fluid flex-grow-1 bg-light py-3">
        <h1 class="h4 mb-4">Delete Account</h1>

        <section class="row justify-content-center">
            <div class="col-11 col-md-9 col-lg-8 col-xl-7">
                <form class="alert alert-info border border-dark rounded-0 p-3 p-md-4 mb-0">
                    <div class="row align-items-center mb-3">
                        <label for="playerId" class="col-sm-3 col-form-label">Player ID:</label>
                        <div class="col-sm-9">
                            <input id="playerId" name="playerId" type="text" class="form-control rounded-0">
                        </div>
                    </div>

                    <div class="row align-items-center mb-4">
                        <label for="password" class="col-sm-3 col-form-label">Password:</label>
                        <div class="col-sm-9">
                            <input id="password" name="password" type="password" class="form-control rounded-0">
                        </div>
                    </div>

                    <div class="row align-items-center mb-3">
                        <div class="col">
                            <span>Warning: [insert warning text here]</span>
                        </div>
                        <div class="col-auto">
                            <input class="form-check-input rounded-0 border-dark" type="checkbox" id="confirmDelete" aria-label="Confirm account deletion" checked>
                        </div>
                    </div>

                    <div class="text-center">
                        <button type="button" class="btn btn-link link-dark text-decoration-none">[ Submit ]</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: siteFooter}"></div>

</body>

</html>
