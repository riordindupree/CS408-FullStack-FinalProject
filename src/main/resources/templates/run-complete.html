<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Complete - 99 Steps &amp; 7 Falls</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="container-fluid flex-grow-1 bg-light py-3">
        <section class="row justify-content-center">
            <div class="col-11 col-md-9 col-lg-8 col-xl-7">
                <div class="alert alert-info border border-dark rounded-0 p-3 p-md-4">
                    <h1 class="h4 mb-3" th:text="${won} ? 'Run Complete!' : 'Game Over'">Run Complete!</h1>
                    <p>Your score: <strong th:text="${score}"></strong></p>

                    <div th:if="${saved}" class="alert alert-success rounded-0" role="status">
                        This run has been saved to your account.
                    </div>
                    <div th:if="${playerId != null}" class="alert alert-success rounded-0" role="status">
                        Your new Player ID is <strong th:text="${playerId}"></strong>. Keep it to log in later.
                    </div>
                    <div th:if="${passwordError}" class="alert alert-danger rounded-0" role="alert">
                        Choose a password with at least 8 characters.
                    </div>

                    <div th:if="${!saved and loggedInPlayerId == null and !create}" class="mb-4">
                        <h2 class="h5">Save this run</h2>
                        <div class="d-flex flex-wrap gap-2">
                            <a class="btn btn-dark rounded-0" th:href="@{/login(runComplete=true)}">
                                Add Run To Existing Account
                            </a>
                            <form method="post" th:action="@{/run/complete/create}">
                                <button class="btn btn-outline-dark rounded-0" type="submit">
                                    Create New Account
                                </button>
                            </form>
                        </div>
                    </div>

                    <div th:if="${!saved and (create or loggedInPlayerId != null)}" class="mb-4">
                        <h2 class="h5">Create an account to save this run</h2>
                        <a th:if="${create and loggedInPlayerId == null}"
                           class="d-inline-block mb-3" th:href="@{/run/complete}">Back to account options</a>
                        <form method="post" th:action="@{/account/create}">
                            <label for="password" class="form-label">Password</label>
                            <input id="password" name="password" type="password"
                                class="form-control rounded-0 mb-3" minlength="8" required>
                            <button type="submit" class="btn btn-link link-dark text-decoration-none">
                                [ Create Account &amp; Save Run ]
                            </button>
                        </form>
                    </div>

                    <form method="post" th:action="@{/start/reset}">
                        <button class="btn btn-link link-dark text-decoration-none" type="submit">
                            [ Start a New Game ]
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>

</html>
