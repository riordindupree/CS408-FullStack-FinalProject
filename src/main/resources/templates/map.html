<!DOCTYPE html>
<html lang="en">

<!-- map.html : defines a default file layout for the map page. Meant to be replaced or written over once game is actually implemented. -->

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99 Steps & 7 Falls</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="container-fluid flex-grow-1 bg-light py-3">
        <div class="mb-3">
            <label for="floor" class="form-label">Select floor</label>
            <select id="floor" class="form-select w-auto">
                <option selected>Choose a floor...</option>
                <option value="1">Floor 1</option>
                <option value="2">Floor 2</option>
                <option value="3">Floor 3</option>
            </select>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered border-dark table-info text-center align-middle mb-0" aria-label="Map board">
                <tbody>
                    <tr>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                    </tr>
                    <tr>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                    </tr>
                    <tr>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                    </tr>
                    <tr>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                    </tr>
                    <tr>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                        <td class="py-5">?</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: siteFooter}"></div>

</body>

</html>
