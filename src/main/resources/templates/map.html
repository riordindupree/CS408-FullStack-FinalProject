<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99 Steps & 7 Falls</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="container-fluid flex-grow-1 bg-light py-3">
        <form method="get" th:action="@{/map}" class="mb-3 d-flex align-items-end gap-2">
            <label for="floor" class="form-label">Select floor</label>
            <select id="floor" name="floor" class="form-select w-auto">
                <option th:each="floor : ${floors}"
                        th:value="${floor}"
                        th:text="|Floor ${floor}|"
                        th:selected="${floor == selectedFloor}">
                </option>
            </select>
            <button type="submit" class="btn btn-dark">Show floor</button>
        </form>

        <div class="table-responsive">
            <table class="table table-bordered border-dark table-info text-center align-middle mb-0" aria-label="Map board">
                <tbody th:each="mapRow : ${mapRows}">
                    <tr>
                        <td th:each="tile : ${mapRow}" class="map-tile" th:text="${tile}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <style>
        .map-tile {
            min-width: 7rem;
            height: 7rem;
            white-space: pre-wrap;
        }
    </style>

    <div th:replace="~{fragments/footer :: siteFooter}"></div>

    <script>
        window.addEventListener("storage", function (event) {
            if (event.key === "game-moved") {
                window.location.reload();
            }
        });
    </script>

</body>

</html>
